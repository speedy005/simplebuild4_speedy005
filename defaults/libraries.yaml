# SimpleBuild4 (s4) Library Build Recipes
#
# Each library can have multiple variants (versions).
# Fields on library level are defaults — variants inherit and can override.
#
# Placeholders replaced at build time:
#   @VERSION@    — Library version
#   @PREFIX@     — Install prefix (toolchain sysroot)
#   @CROSS@      — Compiler prefix (e.g. arm-oe-linux-gnueabi-)
#   @TARGET@     — Target triplet (e.g. arm-oe-linux-gnueabi)
#   @CC@         — C compiler binary
#   @RANLIB@     — Ranlib binary
#   @CFLAGS@     — Architecture-specific C flags from toolchain
#   @LDFLAGS@    — Linker flags from toolchain
#   @CPUS@       — Number of CPU threads
#
# requires: optional, e.g. "c11" — marks variants needing C11 compiler support
# extra: optional, shell commands run before configure, keyed by toolchain trait
# depends: optional, list of libraries that must be built first

libraries:

  - name: OpenSSL
    pc_file: openssl.pc
    removal:
      extra_basenames: [ssl, crypto]
      include_dirs: [openssl]
    version_check: github:openssl/openssl
    source: https://github.com/openssl/openssl/releases/download/openssl-@VERSION@/openssl-@VERSION@.tar.gz
    configure: "./Configure linux-generic32 --prefix=@PREFIX@ shared no-tests no-threads"
    make: "make -j@CPUS@"
    install: "make install_sw"
    extra:
      musl: 'export CFLAGS="$CFLAGS -DOPENSSL_NO_ASYNC"'
      uclibc: 'export CFLAGS="$CFLAGS -DOPENSSL_NO_ASYNC"'
      android: 'export ANDROID_NDK=@TOOLCHAIN@; unset CC; unset RANLIB'
    variants:
      - version: "4.0.3"
        label: "4.0.x (latest)"
        requires: "c11"
      - version: "3.6.5"
        label: "3.6.x (current)"
        requires: "c11"
      - version: "3.5.9"
        label: "3.5.x (LTS)"
        requires: "c11"
      - version: "3.4.8"
        label: "3.4.x"
        requires: "c11"
      - version: "3.3.7"
        label: "3.3.x"
        requires: "c11"
      - version: "3.2.6"
        label: "3.2.x"
        requires: "c11"
      - version: "3.1.8"
        label: "3.1.x"
        requires: "c11"
      - version: "3.0.22"
        label: "3.0.x (LTS)"
        requires: "c11"
      - version: "1.1.1w"
        label: "1.1.1 (legacy LTS)"
        source: https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-@VERSION@.tar.gz
        configure: "./Configure linux-generic32 --prefix=@PREFIX@ shared no-tests"
      - version: "1.1.0l"
        label: "1.1.0 (old)"
        source: https://github.com/openssl/openssl/archive/refs/tags/OpenSSL_1_1_0l.tar.gz
        # no-tests does not exist in OpenSSL 1.1.0 — tests are skipped
        # by simply not running `make test` (we never do).
        configure: "./Configure linux-generic32 --prefix=@PREFIX@ shared"
      - version: "1.0.2u"
        label: "1.0.2 (very old)"
        source: https://github.com/openssl/openssl/archive/refs/tags/OpenSSL_1_0_2u.tar.gz
        configure: "./Configure --prefix=@PREFIX@ linux-generic32 shared"
        make: "make -j@CPUS@ || make"
        install: "make install SHLIB_VERSION_NUMBER=1.0.2 SHLIB_MINOR=0.2"
      - version: "1.0.2u-100"
        label: "1.0.2 as 1.0.0 (very old)"
        source: https://github.com/openssl/openssl/archive/refs/tags/OpenSSL_1_0_2u.tar.gz
        configure: "./Configure --prefix=@PREFIX@ linux-generic32 shared"
        make: "make -j@CPUS@ || make"
        install: "make install"
      - version: "1.0.0t"
        label: "1.0.0 (ancient)"
        source: https://github.com/openssl/openssl/archive/refs/tags/OpenSSL_1_0_0t.tar.gz
        configure: "./Configure --prefix=@PREFIX@ linux-generic32 shared"
        make: "make -j@CPUS@ || make"
        install: "make install"
        extra: {}
      - version: "0.9.8zh"
        label: "0.9.8 (ancient)"
        source: https://github.com/openssl/openssl/archive/refs/tags/OpenSSL_0_9_8zh.tar.gz
        configure: "./Configure --prefix=@PREFIX@ linux-generic32 shared"
        make: "make -j@CPUS@ || make"
        install: "make install"
        extra: {}

  - name: libcurl
    pc_file: libcurl.pc
    removal:
      include_dirs: [curl]
    version_check: github:curl/curl
    configure: "./configure --host=@TARGET@ --prefix=@PREFIX@ --with-openssl --without-libpsl --disable-manual --disable-docs"
    make: "make -j@CPUS@"
    install: "make install"
    depends: [OpenSSL, zlib]
    variants:
      - version: "8.23.0"
        label: "8.x (current, needs OpenSSL 3)"
        requires: "c11"
        source: https://github.com/curl/curl/releases/download/curl-8_23_0/curl-@VERSION@.tar.gz
      - version: "7.88.1"
        label: "7.88 (works with OpenSSL 1.x/0.9.8)"
        source: https://github.com/curl/curl/releases/download/curl-7_88_1/curl-@VERSION@.tar.gz
        configure: "./configure --host=@TARGET@ --prefix=@PREFIX@ --with-openssl --without-libpsl --disable-manual"

  - name: libusb
    pc_file: libusb-1.0.pc
    removal:
      include_dirs: [libusb-1.0]
    version_check: github:libusb/libusb
    source: https://github.com/libusb/libusb/releases/download/v@VERSION@/libusb-@VERSION@.tar.bz2
    configure: "./configure --host=@TARGET@ --prefix=@PREFIX@ --enable-shared --enable-static --disable-udev"
    make: "make -j@CPUS@"
    install: "make install"
    extra:
      csky: 'for f in $(find . -name config.sub); do grep -q "csky" "$f" || sed -i "s/| mcore | mep | metag /| mcore | mep | metag | csky /;s/| mcore-\* | metag-\* /| mcore-* | metag-* | csky-* /" "$f"; done'
    variants:
      - version: "1.0.30"
        label: "1.0.x (current)"
        requires: "c11"
      - version: "1.0.23"
        label: "1.0.23 (no C11 needed)"
      - version: "0.1.12"
        label: "0.1.x (legacy API)"
        pc_file: libusb.pc
        source: https://repository.timesys.com/buildsources/l/libusb/libusb-0.1.12/libusb-0.1.12.tar.gz
        configure: "./configure --host=@TARGET@ --prefix=@PREFIX@"

  - name: pcsclite
    pc_file: libpcsclite.pc
    export:
      extra_files: ["libpcscspy.so*", "pcsc_scan"]
    removal:
      extra_basenames: [pcsclite_real]
      extra_files: ["libpcscspy.so*", "libpcscspy.a", "libpcscspy.la", "pcsc_scan"]
      include_dirs: [PCSC]
    version_check: github:LudovicRousseau/PCSC
    source: https://github.com/LudovicRousseau/PCSC/archive/refs/tags/@VERSION@.tar.gz
    pre_configure: "./bootstrap"
    extra:
      "post:csky": 'for f in $(find . -name config.sub); do grep -q "csky" "$f" || sed -i "s/| mcore | mep | metag /| mcore | mep | metag | csky /;s/| mcore-\* | metag-\* /| mcore-* | metag-* | csky-* /" "$f"; done'
      resolve_libusb: 'export LIBUSB_CFLAGS="$(pkg-config --cflags libusb-1.0)"; export LIBUSB_LIBS="$(pkg-config --libs libusb-1.0)"'
      fix_version: 'find . -name "configure.ac" -type f -exec sed -i "s/[0-9]\.[0-9]\.[0-9]/@VERSION@/g" {} \;'
      fix_wirecheck: 'find . -name "pcsc-wirecheck-main.c" -type f -exec sed -i "s/pcsc_assert_wire_constants ()/0/g" {} \;'
      # pcsclite 2.4.x calls issetugid() (glibc 2.34+); stub it to 0, so older cross toolchains
      # without it can link. Newer toolchains (e.g. uClibc-ng) already declare issetugid() in
      # unistd.h, so unconditionally stubbing it redefines the macro against that declaration
      # and breaks the build ("macro issetugid passed 1 arguments, but takes just 0"). Probe the
      # actual cross compiler first and only stub when issetugid() is really missing.
      fix_issetugid: 'if ! printf "int main(void){issetugid();return 0;}" | @CC@ -xc - -o /tmp/.issetugid_test_$$ >/dev/null 2>&1; then export CFLAGS="$CFLAGS -Dissetugid\(\)=0"; fi; rm -f /tmp/.issetugid_test_$$'
      android: 'export CFLAGS="$CFLAGS -Dpthread_cancel\(t\)=0"'
    configure: "./configure --host=@TARGET@ --prefix=@PREFIX@ --enable-shared --enable-static --disable-polkit --disable-libsystemd --disable-libudev --with-systemdsystemunitdir=@PREFIX@/lib/systemd/system --enable-libusb --enable-usbdropdir=@PREFIX@/lib/pcsc/drivers --enable-serialconfdir=@PREFIX@/etc/reader.conf.d"
    make: "make -j@CPUS@"
    install: "make install"
    depends: [libusb, zlib]
    variants:
      - version: "2.5.3"
        label: "2.x (current)"
        requires: "c11"
        pre_configure: ""
        configure: meson setup build --cross-file=@MESON_CROSS@ --prefix=@PREFIX@ --buildtype=plain --default-library=both -Dpolkit=false -Dlibsystemd=false -Dlibudev=false -Dlibusb=true -Dusbdropdir=@PREFIX@/lib/pcsc/drivers -Dserialconfdir=@PREFIX@/etc/reader.conf.d
        make: ninja -C build -j@CPUS@
        install: ninja -C build install
        post_install: |
          echo "Building pcsc-tools (pcsc_scan)..."
          git clone --depth 1 https://github.com/LudovicRousseau/pcsc-tools.git pcsc-tools-src
          cd pcsc-tools-src
          ./bootstrap
          PKG_CONFIG_LIBDIR="@PREFIX@/lib/pkgconfig" ./configure --host=@TARGET@ --prefix=@PREFIX@ PCSC_LIBS="$(PKG_CONFIG_LIBDIR=@PREFIX@/lib/pkgconfig pkg-config --libs libpcsclite)" PCSC_CFLAGS="$(PKG_CONFIG_LIBDIR=@PREFIX@/lib/pkgconfig pkg-config --cflags libpcsclite)"
          make -j@CPUS@
          make install
      - version: "1.9.5"
        label: "1.9.5 (no C11 needed)"
        post_install: |
          echo "Building pcsc-tools 1.5.8 (pcsc_scan, no C11)..."
          git clone --depth 1 --branch 1.5.8 https://github.com/LudovicRousseau/pcsc-tools.git pcsc-tools-src
          cd pcsc-tools-src
          ./bootstrap
          PKG_CONFIG_LIBDIR="@PREFIX@/lib/pkgconfig" ./configure --host=@TARGET@ --prefix=@PREFIX@ PCSC_LIBS="$(PKG_CONFIG_LIBDIR=@PREFIX@/lib/pkgconfig pkg-config --libs libpcsclite)" PCSC_CFLAGS="$(PKG_CONFIG_LIBDIR=@PREFIX@/lib/pkgconfig pkg-config --cflags libpcsclite)"
          make -j@CPUS@
          make install

  - name: ccid
    pc_file: libccid.pc
    export:
      extra_files: ["libccid.so", "libccidtwin.so", "Info.plist"]
    removal:
      extra_dirs: [lib/pcsc, etc/reader.conf.d]
    version_check: github:LudovicRousseau/CCID
    source: https://github.com/LudovicRousseau/CCID/archive/refs/tags/@VERSION@.tar.gz
    pre_configure: "./bootstrap"
    extra:
      "post:csky": 'for f in $(find . -name config.sub); do grep -q "csky" "$f" || sed -i "s/| mcore | mep | metag /| mcore | mep | metag | csky /;s/| mcore-\* | metag-\* /| mcore-* | metag-* | csky-* /" "$f"; done'
      resolve_deps: 'export PCSC_CFLAGS="$(pkg-config --cflags libpcsclite)"; export PCSC_LIBS="$(pkg-config --libs libpcsclite)"; export LIBUSB_CFLAGS="$(pkg-config --cflags libusb-1.0)"; export LIBUSB_LIBS="$(pkg-config --libs libusb-1.0)"'
      # ccid uses clock_gettime which old glibc (<2.17) keeps in librt; add -lrt only when librt actually exists in the sysroot (musl toolchains don't ship it).
      fix_librt: 'if ls @PREFIX@/lib/librt.* >/dev/null 2>&1; then export LDFLAGS="$LDFLAGS -lrt"; fi'
      # ccid 1.7.x has the same issetugid() (glibc 2.34+) issue as pcsclite. Probe the actual
      # cross compiler first and only stub issetugid() when it's really missing (see pcsclite's
      # fix_issetugid above for the full rationale).
      fix_issetugid: 'if ! printf "int main(void){issetugid();return 0;}" | @CC@ -xc - -o /tmp/.issetugid_test_$$ >/dev/null 2>&1; then export CFLAGS="$CFLAGS -Dissetugid\(\)=0"; fi; rm -f /tmp/.issetugid_test_$$'
    configure: "./configure --host=@TARGET@ --prefix=@PREFIX@ --sysconfdir=@PREFIX@/etc --enable-static --enable-twinserial --enable-usbdropdir=@PREFIX@/lib/pcsc/drivers --enable-serialconfdir=@PREFIX@/etc/reader.conf.d"
    make: "make -j@CPUS@"
    install: "make install && mkdir -p @PREFIX@/lib/pkgconfig && echo -e \"prefix=@PREFIX@\nexec_prefix=@PREFIX@\nlibdir=@PREFIX@/lib\nusbdropdir=@PREFIX@/lib/pcsc/drivers\nserialconfdir=@PREFIX@/etc/reader.conf.d\n\nName: CCID IFD Handler\nDescription: Generic USB CCID and ICCD driver\nVersion: @VERSION@\nRequires: libusb-1.0 libpcsclite\" > @PREFIX@/lib/pkgconfig/libccid.pc"
    depends: [pcsclite, libusb, zlib]
    variants:
      - version: "1.8.4"
        label: "1.x (current)"
        requires: "c11"
        pre_configure: ""
        configure: meson setup build --cross-file=@MESON_CROSS@ --prefix=@PREFIX@ --buildtype=plain --default-library=both -Dpcsclite=true -Dserial=true -Dudev-rules=false -Dclass=false
        make: ninja -C build -j@CPUS@
        install: |
          ninja -C build install
          mkdir -p @PREFIX@/lib/pkgconfig
          printf 'prefix=@PREFIX@\nexec_prefix=@PREFIX@\nlibdir=@PREFIX@/lib\nusbdropdir=@PREFIX@/lib/pcsc/drivers\nserialconfdir=@PREFIX@/etc/reader.conf.d\n\nName: CCID IFD Handler\nDescription: Generic USB CCID and ICCD driver\nVersion: @VERSION@\nRequires: libusb-1.0 libpcsclite\n' > @PREFIX@/lib/pkgconfig/libccid.pc
      - version: "1.4.36"
        label: "1.4.x (no C11 needed)"
        pre_configure: |
          mkdir -p PCSC PCSC-contrib
          curl -sL https://github.com/LudovicRousseau/PCSC/archive/refs/tags/pcsc-1.9.0.tar.gz | tar -xz --strip-components=1 -C PCSC
          curl -sL https://github.com/LudovicRousseau/PCSC-contrib/archive/refs/heads/master.tar.gz | tar -xz --strip-components=1 -C PCSC-contrib
          ./bootstrap

  - name: libdvbcsa
    pc_file: libdvbcsa.pc
    removal:
      include_dirs: [dvbcsa]
    version_check: github:oe-mirrors/libdvbcsa
    source: https://github.com/oe-mirrors/libdvbcsa/archive/refs/heads/master.zip
    archive_filename: libdvbcsa-master.zip
    pre_configure: "autoreconf -i"
    configure: "./configure --host=@TARGET@ --prefix=@PREFIX@ $OPTIMIZATION"
    make: "make -j@CPUS@"
    install: "make install && mkdir -p @PREFIX@/lib/pkgconfig && echo -e \"prefix=@PREFIX@\nexec_prefix=@PREFIX@\nlibdir=@PREFIX@/lib\nincludedir=@PREFIX@/include\n\nName: libdvbcsa\nDescription: DVB Common Scrambling algorithm (${BITSLICE:-unknown})\nVersion: 1.1.0-${BATCHSIZE:-0}-${BITSLICE:-unknown}\nCflags: -I@PREFIX@/include\nLibs: -L@PREFIX@/lib -ldvbcsa\" > @PREFIX@/lib/pkgconfig/libdvbcsa.pc"
    extra:
      "post:csky": 'for f in $(find . -name config.sub); do grep -q "csky" "$f" || sed -i "s/| mcore | mep | metag /| mcore | mep | metag | csky /;s/| mcore-\* | metag-\* /| mcore-* | metag-* | csky-* /" "$f"; done'
      fix_includes: |
        for f in $(find . -name "dvbcsa_pv.h"); do
          if ! grep -q "#include <stdint.h>" "$f"; then
            { echo "#include <stdint.h>"; echo "#include <stddef.h>"; echo "#include <string.h>"; cat "$f"; } > "$f.new" && mv "$f.new" "$f"
          fi
        done
      auto_bitslice: |
        OPT=""; BATCHSIZE="32"; BITSLICE="uint32"
        echo "#include <altivec.h>" | @CC@ @CFLAGS@ -maltivec -c -x c -o /dev/null - 2>/dev/null && OPT="--enable-altivec" && BATCHSIZE="128" && BITSLICE="altivec"
        [ -z "$OPT" ] && @CC@ --target-help 2>&1 | grep -qiw avx2 && OPT="--enable-avx2" && BATCHSIZE="256" && BITSLICE="avx2"
        [ -z "$OPT" ] && @CC@ --target-help 2>&1 | grep -qiw ssse3 && OPT="--enable-ssse3" && BATCHSIZE="128" && BITSLICE="ssse3"
        [ -z "$OPT" ] && @CC@ --target-help 2>&1 | grep -qiw sse2 && OPT="--enable-sse2" && BATCHSIZE="128" && BITSLICE="sse2"
        [ -z "$OPT" ] && @CC@ --target-help 2>&1 | grep -qiw mmx && OPT="--enable-mmx" && BATCHSIZE="64" && BITSLICE="mmx"
        [ -z "$OPT" ] && { case "@CFLAGS@" in *-mfpu=*) _f="";; *) [[ "@TARGET@" =~ arm ]] && _f="-mfpu=neon" || _f="";; esac; echo | @CC@ @CFLAGS@ $_f -E -dM -x c - 2>/dev/null | grep -q __ARM_NEON && OPT="--enable-neon" && BATCHSIZE="128" && BITSLICE="neon"; }
        [ -z "$OPT" ] && [[ "@TARGET@" =~ aarch64 ]] && OPT="--enable-uint64" && BATCHSIZE="64" && BITSLICE="uint64"
        [ -z "$OPT" ] && OPT="--enable-uint32"
        export OPTIMIZATION="$OPT"
    variants:
      - version: "auto"
        label: "1.1.0 (autodetect bitslice)"
      - version: "1.1.0-64"
        label: "1.1.0 uint64 (force)"
        extra:
          auto_bitslice: 'BATCHSIZE="64"; BITSLICE="uint64"; export OPTIMIZATION="--enable-uint64"'
        configure: "./configure --host=@TARGET@ --prefix=@PREFIX@ --enable-uint64"
      - version: "1.1.0-32"
        label: "1.1.0 uint32 (force)"
        extra:
          auto_bitslice: 'BATCHSIZE="32"; BITSLICE="uint32"; export OPTIMIZATION="--enable-uint32"'
        configure: "./configure --host=@TARGET@ --prefix=@PREFIX@ --enable-uint32"

  - name: zlib
    pc_file: zlib.pc
    removal:
      include_files: [zlib.h, zconf.h]
    version_check: github:madler/zlib
    source: https://github.com/madler/zlib/releases/download/v@VERSION@/zlib-@VERSION@.tar.gz
    configure: "CROSS_PREFIX=@CROSS@ ./configure --prefix=@PREFIX@"
    make: "make -j@CPUS@"
    install: "make install"
    variants:
      - version: "1.3.2"
        label: "current"
