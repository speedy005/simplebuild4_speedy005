mcp_transport_http: "Streamable HTTP (current)"
tt_mcp_transport: "Which HTTP transport the MCP server speaks.\n\n• HTTP + SSE — spec rev 2024-11-05. Two endpoints:\n  GET /sse (event stream) + POST /messages/. Still the\n  default for broader client compatibility.\n\n• Streamable HTTP — spec rev 2025-03-26. Single\n  endpoint POST /mcp, bidirectional over one response.\n  Use this for newer MCP clients (e.g. current Claude).\n\nChanging this reinstalls the systemd unit; the client\nURL becomes /sse or /mcp accordingly."
